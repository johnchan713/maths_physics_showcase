permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install historical replay dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-scipy python3-mpmath python3-sympy

      - name: Check corrected complete-potential diagonal
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/evidence.json \
            --output navier_stokes_corrected_diagonal_join_ci.json

      - name: Check corrected same-field punctured endpoint
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_endpoint_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_endpoint_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_corrected_endpoint_join/evidence.json \
            --output navier_stokes_corrected_endpoint_join_ci.json

      - name: Check corrected same-field localization, force and energy
