permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install historical replay dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-scipy python3-mpmath python3-sympy

      - name: Check corrected complete-potential diagonal
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_complete_potential_diagonal_join/evidence.json \
            --output navier_stokes_corrected_diagonal_join_ci.json

      - name: Check corrected same-field punctured endpoint
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_endpoint_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_endpoint_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_corrected_endpoint_join/evidence.json \
            --output navier_stokes_corrected_endpoint_join_ci.json

      - name: Check corrected same-field localization, force and energy
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_force_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_force_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_corrected_force_join/evidence.json \
            --output navier_stokes_corrected_force_join_ci.json

      - name: Check corrected same-field pressure recovery and comparison
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_comparison_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_comparison_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_corrected_comparison_join/evidence.json \
            --output navier_stokes_corrected_comparison_join_ci.json

      - name: Reconcile corrected foundation frontier
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_foundation_frontier/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_corrected_foundation_frontier/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_corrected_foundation_frontier/evidence.json \
            --output navier_stokes_corrected_foundation_frontier_ci.json

      - name: Join leading profile to rule-defined Borel background
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_leading_background_borel_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_leading_background_borel_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_leading_background_borel_join/evidence.json \
            --output navier_stokes_leading_background_borel_join_ci.json

      - name: Join same-band phase normal value and cone gaps
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_same_band_gap_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_same_band_gap_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_same_band_gap_join/evidence.json \
            --output navier_stokes_same_band_gap_join_ci.json

      - name: Join canonical full-path ODE pressure and cutoffs
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_canonical_full_path_ode_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_canonical_full_path_ode_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_canonical_full_path_ode_join/evidence.json \
            --output navier_stokes_canonical_full_path_ode_join_ci.json

      - name: Join fixed-profile compensator and same-choice projectors
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_fixed_profile_projector_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_fixed_profile_projector_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_fixed_profile_projector_join/evidence.json \
            --output navier_stokes_fixed_profile_projector_join_ci.json

      - name: Join compact and slow inverse weighted domains
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_compact_slow_inverse_domain_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_compact_slow_inverse_domain_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_compact_slow_inverse_domain_join/evidence.json \
            --output navier_stokes_compact_slow_inverse_domain_join_ci.json

      - name: Join sharper initial target rate on inverse domains
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_sharp_initial_target_domain_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_sharp_initial_target_domain_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_sharp_initial_target_domain_join/evidence.json \
            --output navier_stokes_sharp_initial_target_domain_join_ci.json

      - name: Close certified first-real high-jet and compact-tail domains
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_first_real_high_jet_domain_closure/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_first_real_high_jet_domain_closure/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_first_real_high_jet_domain_closure/evidence.json \
            --output navier_stokes_first_real_high_jet_domain_closure_ci.json

      - name: Close certified first-sourced high-jet and compact-tail domains
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_first_sourced_high_jet_domain_closure/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_first_sourced_high_jet_domain_closure/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_first_sourced_high_jet_domain_closure/evidence.json \
            --output navier_stokes_first_sourced_high_jet_domain_closure_ci.json

      - name: Recheck synchronized finite-stage recurrence
        run: /usr/bin/python3 research/navier_stokes_cascade/results/core_finite_stage_compact_recurrence/test_audit.py -v

      - name: Join certified primitive domains to every fixed finite stage
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_finite_stage_domain_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_finite_stage_domain_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_certified_finite_stage_domain_join/evidence.json \
            --output navier_stokes_certified_finite_stage_domain_join_ci.json

      - name: Join certified finite stages to the complete-potential diagonal
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_diagonal_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_diagonal_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_certified_complete_potential_diagonal_join/evidence.json \
            --output navier_stokes_certified_complete_potential_diagonal_join_ci.json

      - name: Join certified complete-potential field to the punctured endpoint atlas
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_endpoint_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_endpoint_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_certified_complete_potential_endpoint_join/evidence.json \
            --output navier_stokes_certified_complete_potential_endpoint_join_ci.json

      - name: Join certified complete-potential field to localization force and energy
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_force_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_force_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_certified_complete_potential_force_join/evidence.json \
            --output navier_stokes_certified_complete_potential_force_join_ci.json

      - name: Join certified complete-potential field to pressure recovery and comparison
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_comparison_join/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_certified_complete_potential_comparison_join/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_certified_complete_potential_comparison_join/evidence.json \
            --output navier_stokes_certified_complete_potential_comparison_join_ci.json

      - name: Identify same-field core pressure with completed leading backward pressure
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/core_same_field_pressure_reconciliation/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/core_same_field_pressure_reconciliation/audit.py \
            --verify-record research/navier_stokes_cascade/results/core_same_field_pressure_reconciliation/evidence.json \
            --output navier_stokes_same_field_pressure_reconciliation_ci.json

