          --viscosity 0.02
          --energy 10
          --dt 0.005
          --final-time 0.08
          --diagnostic-every 25
          --state-input
          research/navier_stokes_cascade/candidates/wave_k3_smoothmax_t008_screening.csv
          --output navier_stokes_smoothmax_candidate_fftw.csv

      - name: Replay amplification finalist through independent FFTW
        run: |
