            -I research/navier_stokes_cascade/include \
            research/navier_stokes_cascade/tests/test_continuation.cpp \
            -lfftw3 -o navier_stokes_continuation_sanitized
          ./navier_stokes_continuation_sanitized

      - name: Sanitize late-growth trajectory adjoint
        run: |
          c++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Werror \
            -I research/navier_stokes_cascade/include \
            research/navier_stokes_cascade/tests/test_late_growth.cpp \
            -o navier_stokes_late_growth_sanitized
          ./navier_stokes_late_growth_sanitized

      - name: Exercise late-growth discovery and held-out checks
        run: |
          python3 research/navier_stokes_cascade/scripts/robust_search.py \
            --optimizer ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --oracle ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare \
            --growth-objective late-rate --families wave-packets --starts 1 --bandwidth 2 \
            --discovery-time 0.005 --holdout-time 0.01 --max-finalists 1 \
            --output-dir navier_stokes_late_smoke
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          m = json.loads(Path('navier_stokes_late_smoke/manifest.json').read_text())
          assert len(m['runs']) == 4
          assert all('late_growth' in r['result'] for r in m['runs'])
          assert all(not r['result']['numerical_failures'] for r in m['runs'])
          assert m['runs'][-1]['result']['late_growth']['samples'] == 9
          assert m['finalists'][0]['status'] == 'screening-only'
          rows = list(csv.DictReader(Path('navier_stokes_late_smoke/wave-packets-0-discovery/trace.csv').open()))
          assert any(r['stage'] == 'accepted' for r in rows)
          assert all(float(r['gradient_relative_error']) < 0.01 for r in rows if r['stage'] == 'gradient-check')
          PY

      - name: Run independent FFTW trajectory comparison
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare
          --grid 16
          --wave-packets
          --packet-width 1.1
          --carrier-mode 2
          --packet-weight 0.75
          --packet-phase 1.0471975511965976
          --final-time 0.005
          --diagnostic-every 2
          --output navier_stokes_fftw_comparison.csv

      - name: Run amplification discovery and held-out screening smoke
        run: |
          python3 research/navier_stokes_cascade/scripts/robust_search.py \
            --optimizer ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --oracle ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare \
            --families wave-packets --starts 1 --bandwidth 2 \
            --discovery-time 0.005 --holdout-time 0.01 --max-finalists 1 \
            --output-dir navier_stokes_robust_smoke
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          m = json.loads(Path('navier_stokes_robust_smoke/manifest.json').read_text())
          assert len(m['runs']) == 4
          assert all('result' in r and not r['result']['numerical_failures'] for r in m['runs'])
          assert len(m['finalists']) == 1
          assert m['finalists'][0]['status'] == 'screening-only'
          assert m['finalists'][0]['failures']
          # Logging frequency must not change the physical evidence or state.
          binary = './build/research/navier_stokes_cascade/navier_stokes_state_optimize'
          base = [binary, '--search-track', 'amplification', '--seed-bandwidth', '2',
                  '--state-input', 'navier_stokes_robust_smoke/wave-packets-0-discovery/state.csv',
                  '--final-time', '0.01', '--dt', '0.0005', '--fine-max-dt', '0.0005',
                  '--iterations', '0']
          for cadence in (1, 97):
              prefix = 'navier_stokes_robust_smoke/cadence-' + str(cadence)
              subprocess.run(base + ['--diagnostic-every', str(cadence),
                             '--output', prefix + '-trace.csv',
                             '--evidence-output', prefix + '-evidence.csv',
                             '--state-output', prefix + '-state.csv'], check=True)
          for suffix in ('evidence', 'state'):
              paths = [Path('navier_stokes_robust_smoke/cadence-' + str(c) + '-' + suffix + '.csv')
                       for c in (1, 97)]
              assert paths[0].read_bytes() == paths[1].read_bytes()
          PY

      - name: Replay smooth-maximum local candidate through independent FFTW
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare
