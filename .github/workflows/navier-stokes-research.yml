name: Navier-Stokes research checks

on:
  push:
    branches:
      - research/navier-stokes-cascade
    paths:
      - CMakeLists.txt
      - research/navier_stokes_cascade/**
      - .github/workflows/navier-stokes-research.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - research/navier_stokes_cascade/**
      - .github/workflows/navier-stokes-research.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install independent FFT, snapshot and paper checks
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev python3-numpy python3-scipy python3-mpmath python3-sympy

      - name: Check explicit source-admissible variance cutoff and actual Z4 Z5 gates
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/explicit_variance_cutoff/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/explicit_variance_cutoff/audit.py \
            --verify-record research/navier_stokes_cascade/results/explicit_variance_cutoff/evidence.json \
            --output navier_stokes_explicit_variance_cutoff_ci.json

      - name: Check compact repaired cone and complete global pressure reconciliation
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/compact_global_reconciliation/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/compact_global_reconciliation/audit.py \
            --verify-record research/navier_stokes_cascade/results/compact_global_reconciliation/evidence.json \
            --output navier_stokes_compact_global_reconciliation_ci.json

      - name: Check explicit coefficient cutoff all fixed jets and pulse gate boundary
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/explicit_coefficient_cutoff/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/explicit_coefficient_cutoff/audit.py \
            --verify-record research/navier_stokes_cascade/results/explicit_coefficient_cutoff/evidence.json \
            --output navier_stokes_explicit_coefficient_cutoff_ci.json

      - name: Check local first coefficient C3 and exact global leading C5 boundary
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/first_coefficient_c3_boundary/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/first_coefficient_c3_boundary/audit.py \
            --verify-record research/navier_stokes_cascade/results/first_coefficient_c3_boundary/evidence.json \
            --output navier_stokes_first_coefficient_c3_boundary_ci.json

      - name: Check same reference fifth angular lift and selected whole support leading K05
        run: |
          /usr/bin/python3 research/navier_stokes_cascade/results/global_leading_c5/test_audit.py -v
          /usr/bin/python3 research/navier_stokes_cascade/results/global_leading_c5/audit.py \
            --verify-record research/navier_stokes_cascade/results/global_leading_c5/evidence.json \
            --output navier_stokes_global_leading_c5_ci.json

      - name: Check full pressure memory first repair and finalized global K13
