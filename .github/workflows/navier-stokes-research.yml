name: Navier-Stokes research checks

on:
  push:
    branches:
      - research/navier-stokes-cascade
    paths:
      - CMakeLists.txt
      - research/navier_stokes_cascade/**
      - .github/workflows/navier-stokes-research.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - research/navier_stokes_cascade/**
      - .github/workflows/navier-stokes-research.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install independent FFT oracle
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DNS_CASCADE_REQUIRE_FFTW_REFERENCE=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build research targets
        run: >-
          cmake --build build --parallel --target
          navier_stokes_cascade
          navier_stokes_convergence
          navier_stokes_fft
          navier_stokes_search
          navier_stokes_optimize
          navier_stokes_tangent_check
          navier_stokes_adjoint_check
          navier_stokes_state_optimize
          navier_stokes_cascade_tests
          navier_stokes_fft_tests
          navier_stokes_candidate_score_tests
          navier_stokes_parameter_optimizer_tests
          navier_stokes_state_optimizer_tests
          navier_stokes_fftw_compare
          navier_stokes_fftw_tests

      - name: Run invariant tests
        run: ctest --test-dir build --output-on-failure

      - name: Run independent FFTW trajectory comparison
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare
          --grid 16
          --wave-packets
          --packet-width 1.1
          --carrier-mode 2
          --packet-weight 0.75
          --packet-phase 1.0471975511965976
          --final-time 0.005
          --diagnostic-every 2
          --output navier_stokes_fftw_comparison.csv

      - name: Replay smooth-maximum local candidate through independent FFTW
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare
          --grid 32
          --viscosity 0.02
          --energy 10
          --dt 0.005
          --final-time 0.08
          --diagnostic-every 25
          --state-input
          research/navier_stokes_cascade/candidates/wave_k3_smoothmax_t008_screening.csv
          --output navier_stokes_smoothmax_candidate_fftw.csv

      - name: Run convergence smoke comparison
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_convergence
          --cutoffs 2,3
          --steps 8
          --diagnostic-every 4
          --output navier_stokes_convergence.csv

      - name: Run FFT convergence smoke comparison
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_convergence
          --backend fft
          --grids 8,16
          --steps 4
          --diagnostic-every 2
          --output navier_stokes_fft_convergence.csv

      - name: Run candidate-search smoke comparison
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_search
          --coarse-grid 16
          --fine-grid 32
          --cores 0.55
          --separations 1.2
          --bends 0.3
          --axial-modes 2
          --families orthogonal-bundle,wave-packets
          --orthogonal-weights 0.75
          --phase-offsets 1.0471975511965976
          --packet-widths 1.1
          --carrier-modes 2
          --packet-weights 0.75
          --packet-phases 1.0471975511965976
          --energy 10
          --final-time 0.03
          --diagnostic-every 5
          --profile-scale-window 0.001
          --top 1
          --output navier_stokes_candidate_search.csv

      - name: Verify candidate search exercised profile windows
        shell: bash
        run: |
          awk -F, '
            NR == 1 {
              expected_columns = NF
              for (i = 1; i <= NF; ++i) column[$i] = i
              next
            }
            NF != expected_columns { malformed = 1 }
            $1 == "fine" && $(column["profile_scale_windows"]) + 0 > 0 {
              found = 1
            }
            END { exit found && !malformed ? 0 : 1 }
          ' navier_stokes_candidate_search.csv

      - name: Run checked-gradient optimizer smoke test
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_optimize
          --grid 16
          --final-time 0.02
          --iterations 1
          --gradient-step 0.015
          --output navier_stokes_packet_optimization.csv

      - name: Verify optimizer accepted a checked improving step
        shell: bash
        run: >-
          awk -F, 'NR > 1 && $2 == "accepted" { found = 1 }
          END { exit found ? 0 : 1 }'
          navier_stokes_packet_optimization.csv

      - name: Run tangent-linear convergence check
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_tangent_check
          --grid 16
          --dt 0.0005
          --final-time 0.01
          --epsilons 0.001,0.0005,0.00025
          --output navier_stokes_tangent_check.csv

      - name: Run reverse discrete-adjoint convergence check
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_adjoint_check
          --grid 16
          --dt 0.0005
          --final-time 0.01
          --epsilons 0.004,0.002,0.001
          --output navier_stokes_adjoint_check.csv

      - name: Run constrained Fourier-state optimizer smoke test
        run: >-
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize
          --grid 16
          --fine-grid 32
          --seed-bandwidth 2
          --starts 2
          --final-time 0.01
          --iterations 1
          --output navier_stokes_state_optimization.csv
          --state-output navier_stokes_optimized_state.csv

      - name: Verify state optimizer accepted a checked joint improvement
        shell: bash
        run: |
          awk -F, '
            NR == 1 {
              expected_columns = NF
              for (i = 1; i <= NF; ++i) column[$i] = i
              next
            }
            NF != expected_columns { malformed = 1 }
            $2 == "accepted" &&
            $(column["gradient_relative_error"]) + 0 < 0.01 &&
            $(column["peak_cutoff_fraction"]) + 0 < 0.01 {
              accepted = 1
            }
            $2 == "line-trial" { trial = 1 }
            $2 == "fine-validation" && $8 == "true" { fine = 1 }
            END { exit accepted && trial && fine && !malformed ? 0 : 1 }
          ' navier_stokes_state_optimization.csv
          test "$(wc -l < navier_stokes_optimized_state.csv)" -gt 1
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --state-input navier_stokes_optimized_state.csv \
            --final-time 0.005 --iterations 0 \
            --output navier_stokes_state_replay.csv \
            --state-output navier_stokes_replayed_state.csv
          cmp navier_stokes_optimized_state.csv navier_stokes_replayed_state.csv
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --seed-bandwidth 3 \
            --state-input research/navier_stokes_cascade/candidates/wave_k3_t008_screening.csv \
            --final-time 0.001 --iterations 0 \
            --output navier_stokes_screening_replay.csv \
            --state-output navier_stokes_screening_state.csv
          cmp research/navier_stokes_cascade/candidates/wave_k3_t008_screening.csv \
            navier_stokes_screening_state.csv
          printf '%s  %s\n' \
            c94bdc0d38f1bd52fcca2072e9dcbe9103a4421d50fa9f10ea84541a4c99a128 \
            research/navier_stokes_cascade/candidates/wave_k3_t008_screening.csv \
            | sha256sum --check --status
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --seed-bandwidth 2 --profile-shape-weight 1 \
            --state-input research/navier_stokes_cascade/candidates/wave_k2_profile_t004_screening.csv \
            --final-time 0.001 --iterations 0 \
            --output navier_stokes_profile_screening_replay.csv \
            --state-output navier_stokes_profile_screening_state.csv
          cmp research/navier_stokes_cascade/candidates/wave_k2_profile_t004_screening.csv \
            navier_stokes_profile_screening_state.csv
          printf '%s  %s\n' \
            dbcdbe925512e7e4896dc3b972a491e27e5b9454e38a4f86f515718f49f4d9df \
            research/navier_stokes_cascade/candidates/wave_k2_profile_t004_screening.csv \
            | sha256sum --check --status
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --seed-bandwidth 3 \
            --state-input research/navier_stokes_cascade/candidates/wave_k3_path_t008_screening.csv \
            --final-time 0.001 --iterations 0 \
            --output navier_stokes_path_screening_replay.csv \
            --state-output navier_stokes_path_screening_state.csv
          cmp research/navier_stokes_cascade/candidates/wave_k3_path_t008_screening.csv \
            navier_stokes_path_screening_state.csv
          printf '%s  %s\n' \
            cd73fe95e4a8c69f193dff3ebe5abd07a8716bf3739ae412a30b95b008b59491 \
            research/navier_stokes_cascade/candidates/wave_k3_path_t008_screening.csv \
            | sha256sum --check --status
          ./build/research/navier_stokes_cascade/navier_stokes_state_optimize \
            --seed-bandwidth 3 --profile-shape-weight 0.25 \
            --profile-path-weight 1 --profile-path-samples 8 \
            --profile-path-temperature 0.01 \
            --state-input research/navier_stokes_cascade/candidates/wave_k3_smoothmax_t008_screening.csv \
            --final-time 0.001 --iterations 0 \
            --output navier_stokes_smoothmax_screening_replay.csv \
            --state-output navier_stokes_smoothmax_screening_state.csv
          cmp research/navier_stokes_cascade/candidates/wave_k3_smoothmax_t008_screening.csv \
            navier_stokes_smoothmax_screening_state.csv
          printf '%s  %s\n' \
            75818222d22aaaeb0b92f1a417a0309400e810335712b1df9aef729884fcc7b1 \
            research/navier_stokes_cascade/candidates/wave_k3_smoothmax_t008_screening.csv \
            | sha256sum --check --status

      - name: Verify checkpoint restart is bit-for-bit reproducible
        shell: bash
        run: |
          FFT=./build/research/navier_stokes_cascade/navier_stokes_fft
          "$FFT" --grid 8 --cutoff 2 --initial-condition taylor-green \
            --viscosity 0.05 --fixed-dt --dt 0.0005 --final-time 0.0015 \
            --diagnostic-every 2 --output segment-a.csv \
            --shell-output segment-a-shells.csv \
            --profile-output segment-a-profile.csv \
            --checkpoint-output restarted.chk --checkpoint-every 3
          "$FFT" --restart restarted.chk --final-time 0.004 \
            --diagnostic-every 2 --output segment-b.csv \
            --shell-output segment-b-shells.csv \
            --profile-output segment-b-profile.csv \
            --checkpoint-output restarted.chk --checkpoint-every 3
          "$FFT" --grid 8 --cutoff 2 --initial-condition taylor-green \
            --viscosity 0.05 --fixed-dt --dt 0.0005 --final-time 0.004 \
            --diagnostic-every 2 --output uninterrupted.csv \
            --shell-output uninterrupted-shells.csv \
            --profile-output uninterrupted-profile.csv \
            --checkpoint-output uninterrupted.chk --checkpoint-every 3
          cmp restarted.chk uninterrupted.chk

      - name: Retain convergence CSV
        uses: actions/upload-artifact@v4
        with:
          name: navier-stokes-convergence
          path: |
            navier_stokes_convergence.csv
            navier_stokes_fft_convergence.csv
            navier_stokes_candidate_search.csv
            navier_stokes_packet_optimization.csv
            navier_stokes_tangent_check.csv
            navier_stokes_adjoint_check.csv
            navier_stokes_state_optimization.csv
            navier_stokes_optimized_state.csv
            navier_stokes_state_replay.csv
            navier_stokes_screening_replay.csv
            navier_stokes_profile_screening_replay.csv
            navier_stokes_fftw_comparison.csv
            navier_stokes_smoothmax_candidate_fftw.csv
            navier_stokes_path_screening_replay.csv
            navier_stokes_smoothmax_screening_replay.csv
            segment-a.csv
            segment-b.csv
            segment-a-profile.csv
            segment-b-profile.csv
