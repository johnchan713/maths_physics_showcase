          from pathlib import Path
          state = Path('research/navier_stokes_cascade/candidates/wave_k3_amplification_t004_screening.csv')
          assert hashlib.sha256(state.read_bytes()).hexdigest() == '5f3dc4449abd58f5ae5e1aca3443b2a0fa7ad06029f9dadae939ff2b9a3b51d8'
          PY
          ./build/research/navier_stokes_cascade/navier_stokes_fftw_compare \
            --grid 32 --viscosity 0.02 --energy 10 --dt 0.000125 \
            --final-time 0.06 --diagnostic-every 25 \
